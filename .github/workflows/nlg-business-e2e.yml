name: NLG Business E2E Tests

on:
  workflow_dispatch:

  schedule:
    # Every 24 hours at 12:00 AM UTC / 8:00 AM Manila
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  playwright-tests:
    name: Run Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: ./businesses

    env:
      CI: true
      PLAYWRIGHT_HTML_OPEN: never

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: businesses/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test --reporter=html

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: nlg-business-playwright-report-${{ github.run_number }}
          path: |
            businesses/playwright-report/
            businesses/test-results/
          if-no-files-found: warn
          retention-days: 30