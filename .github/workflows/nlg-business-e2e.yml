name: NLG Business E2E Tests

on:
  workflow_dispatch:
    inputs:
      grep:
        description: "Tests to grep"
        required: false
        default: ""
      run:
        required: false
      testomatio:
        description: "Legacy Testomat.io input; the TESTOMATIO Actions secret is used"
        required: false
  repository_dispatch:
    types: [my-event-jp]

  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

concurrency:
  group: businesses-e2e-dev
  cancel-in-progress: false

jobs:
  preflight:
    name: Businesses non-secret preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: ./businesses

    env:
      CI: true

    steps:
      - name: Require main for manual runs
        shell: bash
        working-directory: .
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error title=Unsupported ref::Manual Businesses E2E runs must use refs/heads/main."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: businesses/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check Businesses tests
        run: npm run typecheck

      - name: Test resource slot parser and guards
        run: npm run resources:test

      - name: Validate balanced slot, account, and business allocation
        run: npm run slots:validate

      - name: Validate optional test grep
        env:
          REQUESTED_GREP: ${{ github.event.inputs.grep || github.event.client_payload.grep || github.event.client_payload.inputs.grep || '' }}
        shell: bash
        run: |
          if [[ -z "$REQUESTED_GREP" ]]; then
            exit 0
          fi

          npm run test:playwright:list -- --grep="$REQUESTED_GREP"

  playwright-tests:
    needs: preflight
    name: Businesses ${{ matrix.slot_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: ./businesses

    env:
      CI: true

    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - slot_id: slot-00
            secret_name: BUSINESSES_SLOT_00
          - slot_id: slot-01
            secret_name: BUSINESSES_SLOT_01
          - slot_id: slot-02
            secret_name: BUSINESSES_SLOT_02
          - slot_id: slot-03
            secret_name: BUSINESSES_SLOT_03
          - slot_id: slot-04
            secret_name: BUSINESSES_SLOT_04
          - slot_id: slot-05
            secret_name: BUSINESSES_SLOT_05
          - slot_id: slot-06
            secret_name: BUSINESSES_SLOT_06
          - slot_id: slot-07
            secret_name: BUSINESSES_SLOT_07
          - slot_id: slot-08
            secret_name: BUSINESSES_SLOT_08
          - slot_id: slot-09
            secret_name: BUSINESSES_SLOT_09

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: businesses/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate and mask selected slot
        env:
          BUSINESSES_RESOURCE_SLOT_JSON: ${{ secrets[matrix.secret_name] }}
          BUSINESSES_EXPECTED_SLOT_ID: ${{ matrix.slot_id }}
        run: npm run resources:validate

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run selected Playwright slot
        env:
          BUSINESSES_RESOURCE_SLOT_JSON: ${{ secrets[matrix.secret_name] }}
          BUSINESSES_EXPECTED_SLOT_ID: ${{ matrix.slot_id }}
          REQUESTED_GREP: ${{ github.event.inputs.grep || github.event.client_payload.grep || github.event.client_payload.inputs.grep || '' }}
          TESTOMATIO: ${{ secrets.TESTOMATIO }}
          TESTOMATIO_RUN: ${{ github.event.inputs.run || github.event.client_payload.run || github.event.client_payload.inputs.run || '' }}
          TESTOMATIO_PROCEED: ${{ (github.event.inputs.run || github.event.client_payload.run || github.event.client_payload.inputs.run) && 'true' || '' }}
          TESTOMATIO_SHARED_RUN: "true"
          TESTOMATIO_SHARED_RUN_TIMEOUT: "300"
          TESTOMATIO_TITLE: NLG Business E2E ${{ github.run_id }} attempt ${{ github.run_attempt }}
        shell: bash
        run: |
          playwright_args=(--workers=1 --pass-with-no-tests)

          if [[ -n "$TESTOMATIO" ]]; then
            echo "::add-mask::$TESTOMATIO"
          fi

          if [[ -n "$REQUESTED_GREP" ]]; then
            playwright_args+=(--grep "$REQUESTED_GREP")
          fi

          npm run test:playwright -- "${playwright_args[@]}"

      - name: Upload Playwright test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nlg-business-test-results-${{ github.run_number }}-${{ github.run_attempt }}-${{ matrix.slot_id }}
          path: businesses/test-results/
          if-no-files-found: warn
          retention-days: 30

  reset-municipality-test:
    needs: playwright-tests
    name: Businesses TC32 municipality reset
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: ./businesses

    env:
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: businesses/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate and mask reset-lane slot
        env:
          BUSINESSES_RESOURCE_SLOT_JSON: ${{ secrets.BUSINESSES_SLOT_00 }}
          BUSINESSES_EXPECTED_SLOT_ID: slot-00
        run: npm run resources:validate

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run TC32 after the parallel matrix
        env:
          BUSINESSES_RESOURCE_SLOT_JSON: ${{ secrets.BUSINESSES_SLOT_00 }}
          BUSINESSES_EXPECTED_SLOT_ID: slot-00
          E2E_RUN_GLOBAL_STATE: "true"
          REQUESTED_GREP: ${{ github.event.inputs.grep || github.event.client_payload.grep || github.event.client_payload.inputs.grep || '' }}
          TESTOMATIO: ${{ secrets.TESTOMATIO }}
          TESTOMATIO_RUN: ${{ github.event.inputs.run || github.event.client_payload.run || github.event.client_payload.inputs.run || '' }}
          TESTOMATIO_PROCEED: ${{ (github.event.inputs.run || github.event.client_payload.run || github.event.client_payload.inputs.run) && 'true' || '' }}
          TESTOMATIO_SHARED_RUN: "true"
          TESTOMATIO_SHARED_RUN_TIMEOUT: "300"
          TESTOMATIO_TITLE: NLG Business E2E ${{ github.run_id }} attempt ${{ github.run_attempt }}
        shell: bash
        run: |
          playwright_args=(--workers=1 --pass-with-no-tests)

          if [[ -n "$TESTOMATIO" ]]; then
            echo "::add-mask::$TESTOMATIO"
          fi

          if [[ -n "$REQUESTED_GREP" ]]; then
            playwright_args+=(--grep "$REQUESTED_GREP")
          fi

          npm run test:playwright -- "${playwright_args[@]}"

      - name: Upload TC32 Playwright test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nlg-business-test-results-${{ github.run_number }}-${{ github.run_attempt }}-tc32
          path: businesses/test-results/
          if-no-files-found: warn
          retention-days: 30

  finalize-testomatio:
    needs: [playwright-tests, reset-municipality-test]
    if: ${{ always() && !cancelled() && (github.event.inputs.run || github.event.client_payload.run || github.event.client_payload.inputs.run) }}
    name: Finalize Testomat.io run
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: ./businesses

    env:
      CI: true
      TESTOMATIO: ${{ secrets.TESTOMATIO }}
      TESTOMATIO_FINISH_SHARED_RUN: "true"
      TESTOMATIO_RUN: ${{ github.event.inputs.run || github.event.client_payload.run || github.event.client_payload.inputs.run || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: businesses/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Finalize the shared Testomat.io run
        shell: bash
        run: |
          if [[ -z "$TESTOMATIO" ]]; then
            echo "::error title=Missing Actions secret::TESTOMATIO is required to finalize the requested Testomat.io run."
            exit 1
          fi

          npx --no-install @testomatio/reporter finish
