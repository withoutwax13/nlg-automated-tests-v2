name: NLG Filings E2E Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

concurrency:
  group: filings-e2e-dev
  cancel-in-progress: false

jobs:
  preflight:
    name: Filings non-secret preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: ./filings

    steps:
      - name: Require main for manual runs
        shell: bash
        working-directory: .
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error title=Unsupported ref::Manual Filings E2E runs must use refs/heads/main."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Type-check filings tests
        run: npm run typecheck

      - name: Test resource slot parser
        run: npm run resources:test

      - name: Validate balanced slot and account-role allocation
        run: npm run slots:validate

  playwright-tests:
    needs: preflight
    name: Filings ${{ matrix.slot_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 210

    defaults:
      run:
        working-directory: ./filings

    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - slot_id: slot-00
            secret_name: FILINGS_SLOT_00
          - slot_id: slot-01
            secret_name: FILINGS_SLOT_01
          - slot_id: slot-02
            secret_name: FILINGS_SLOT_02
          - slot_id: slot-03
            secret_name: FILINGS_SLOT_03
          - slot_id: slot-04
            secret_name: FILINGS_SLOT_04
          - slot_id: slot-05
            secret_name: FILINGS_SLOT_05
          - slot_id: slot-06
            secret_name: FILINGS_SLOT_06
          - slot_id: slot-07
            secret_name: FILINGS_SLOT_07
          - slot_id: slot-08
            secret_name: FILINGS_SLOT_08
          - slot_id: slot-09
            secret_name: FILINGS_SLOT_09

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Validate and mask selected slot
        env:
          FILINGS_RESOURCE_SLOT_JSON: ${{ secrets[matrix.secret_name] }}
          FILINGS_EXPECTED_SLOT_ID: ${{ matrix.slot_id }}
        run: npm run resources:validate

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run selected Playwright slot
        env:
          FILINGS_RESOURCE_SLOT_JSON: ${{ secrets[matrix.secret_name] }}
          FILINGS_EXPECTED_SLOT_ID: ${{ matrix.slot_id }}
        run: npm run test:playwright -- --grep="@${{ matrix.slot_id }}" --workers=1

  global-approval-state-test:
    needs: playwright-tests
    name: Filings TC40 global approval state
    runs-on: ubuntu-latest
    timeout-minutes: 75

    defaults:
      run:
        working-directory: ./filings

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Validate and mask serial-lane slot
        env:
          FILINGS_RESOURCE_SLOT_JSON: ${{ secrets.FILINGS_SLOT_00 }}
          FILINGS_EXPECTED_SLOT_ID: slot-00
        run: npm run resources:validate

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run TC40 after the parallel matrix
        env:
          FILINGS_RESOURCE_SLOT_JSON: ${{ secrets.FILINGS_SLOT_00 }}
          FILINGS_EXPECTED_SLOT_ID: slot-00
          E2E_RUN_GLOBAL_STATE: "true"
        run: npm run test:playwright -- --workers=1
